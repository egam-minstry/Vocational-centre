<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGAM Ministry | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(145deg,#6a1a1a 0%,#8b2c2c 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
}
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.08"><path fill="gold" d="M20,20 L30,10 L40,20 L30,30 Z M60,60 L70,50 L80,60 L70,70 Z M70,20 L80,10 L90,20 L80,30 Z M20,70 L30,60 L40,70 L30,80 Z"/><circle cx="50" cy="50" r="6" fill="gold"/></svg>');
    background-repeat:repeat;
    background-size:42px;
    pointer-events:none;
    z-index:0;
}
.site-header{
    background:rgba(98,0,0,0.95);
    backdrop-filter:blur(8px);
    padding:20px;
    text-align:center;
    border-bottom:3px solid #f5c542;
    position:relative;
    z-index:10;
}
.logo-container img{
    width:100px;
    height:100px;
    border-radius:50%;
    border:4px solid #f5c542;
    background:white;
    padding:5px;
}
.login-wrapper{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    position:relative;
    z-index:2;
}
.login-card{
    background:white;
    border-radius:30px;
    padding:45px;
    max-width:500px;
    width:100%;
    box-shadow:0 25px 45px rgba(0,0,0,0.3);
}
.login-card h1{
    font-family:'Playfair Display',serif;
    color:#9e2a2a;
    font-weight:700;
    text-align:center;
}
.form-control{
    border-radius:25px;
    padding:12px 20px;
    margin-bottom:18px;
    border:1px solid #e0cfcf;
}
.btn-login{
    background:linear-gradient(95deg,#b54535,#9b2c1c);
    border:none;
    padding:14px;
    border-radius:40px;
    color:white;
    font-weight:600;
    width:100%;
    transition:transform 0.2s;
}
.btn-login:hover{transform:translateY(-2px);}
.checkbox-verify{margin:15px 0;}
.portal-footer{
    background:rgba(0,0,0,0.6);
    color:gold;
    text-align:center;
    padding:15px;
    position:relative;
    z-index:2;
}
@media(max-width:576px){
    .login-card{padding:30px 20px;}
    .logo-container img{width:80px;height:80px;}
}
</style>
</head>
<body>
<div class="site-header">
  <div class="logo-container">
    <img src="img/egamlogo.png" onerror="this.src='https://placehold.co/100x100?text=EGAM'">
  </div>
  <div class="marquee-wrapper" style="width:90%;max-width:850px;margin:15px auto 0;overflow:hidden;background:rgba(255,215,0,0.12);border-radius:60px;padding:10px;">
    <div class="marquee-text" style="color:#ffeaac;animation:marqueeScroll 18s linear infinite;white-space:nowrap;">🎓 EGAM VOCATIONAL CENTRE : IN CHRIST WE HOPE, IN HIM WE GLORY 🎓</div>
    <a href="index.html">Home</a>
  </div>
</div>
<style>@keyframes marqueeScroll{0%{transform:translateX(0%);}100%{transform:translateX(-100%);}}</style>
<div class="login-wrapper">
  <div class="login-card">
    <h1>EGAM MINISTRY</h1>
    <p class="text-center text-muted">Vocational & Entrepreneurship Portal</p>
    <form id="loginForm">
      <input type="email" id="email" class="form-control" placeholder="Email Address" required>
      <input type="password" id="password" class="form-control" placeholder="Password" required>
      <div class="checkbox-verify">
        <label><input type="checkbox" id="verifyCheck"> Verify before login</label>
      </div>
      <button type="submit" class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt me-2"></i> Sign In</button>
    </form>
    <hr>
    <div class="text-center">
      <p>Don't have an account?</p>
      <a href="register.html" class="btn btn-outline-danger rounded-pill px-4">Register Here</a>
    </div>
  </div>
</div>
<div class="portal-footer">
  <p>© 2026 EGAM Ministry. All Rights Reserved.</p>
  <p>Empowering Lives Through Faith & Technology</p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1tQE9cGdP7utPLWqHZjkAgySmaCv2foI",
  authDomain: "egam-ministry.firebaseapp.com",
  projectId: "egam-ministry",
  storageBucket: "egam-ministry.firebasestorage.app",
  messagingSenderId: "276171392995",
  appId: "1:276171392995:web:852e81ad481cd1cf0042d6",
  measurementId: "G-MXN0KLPJGX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const verifyCheck = document.getElementById("verifyCheck");
  
  if(!verifyCheck.checked) {
    Swal.fire('Verification Required', 'Please check the verification box', 'warning');
    return;
  }
  
  const loginBtn = document.getElementById("loginBtn");
  loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Signing In...';
  loginBtn.disabled = true;
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
    Swal.fire({
      title: 'Welcome Back!',
      text: 'Login successful. Redirecting to dashboard...',
      icon: 'success',
      timer: 1500,
      showConfirmButton: false
    }).then(() => {
      window.location.href = "dashboard.html";
    });
  } catch(error) {
    Swal.fire('Login Failed', error.message, 'error');
    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Sign In';
    loginBtn.disabled = false;
  }
});
</script>
</body>
</html>
